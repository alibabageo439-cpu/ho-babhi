name: Keep Supabase Projects Alive

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Project 1
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL_1 }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY_1 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY_1 }}"

      - name: Ping Project 2
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL_2 }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY_2 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY_2 }}"

      - name: Ping Project 3
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL_3 }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY_3 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY_3 }}"

      - name: Ping Project 4
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL_4 }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY_4 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY_4 }}"
